# Render Blueprint for InstaRetriv AI.
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is created; enter them in the dashboard, never in git.
services:
  - type: web
    name: instaretriv-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # Security
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_AUTH_ENABLED
        value: true
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: AUTHORIZED_SENDERS
        sync: false
      - key: REQUIRE_TWILIO_SIGNATURE
        value: true

      # Storage and metadata
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: METADATA_BACKEND
        value: mongo
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: instaretriv_ai
      - key: MONGODB_COLLECTION
        value: documents
      - key: MONGODB_REQUEST_LOG_COLLECTION
        value: request_logs
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Twilio WhatsApp
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SECONDARY_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
